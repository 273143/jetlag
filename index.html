<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Both the title and every string below are replaced from js/i18n.js
     on load; what is here is the Czech default, so the shell reads as the
     game does before any JavaScript has run. -->
<title>Hide + Seek — jižní Morava a Brno</title>
<meta name="theme-color" content="#0d1014">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<!-- Leaflet is vendored rather than pulled from a CDN: the whole point is
     that this still works on a train with no signal. -->
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app" hidden>
  <main id="map"></main>

  <aside id="panel">
    <header id="head">
      <h1>Hide <span>+</span> Seek</h1>
      <div class="sub" id="mode"></div>
    </header>

    <div id="hud">
      <div class="stat"><b id="clock">0m</b><span data-i18n="hud.elapsed">uplynulo</span></div>
      <div class="stat"><b id="candcount">—</b><span data-i18n="hud.possible">možností</span></div>
      <!-- Hidden for the whole round when the deck is out of play. -->
      <div class="stat" id="handstat"><b id="handcount">0</b><span data-i18n="hud.cards">karet skrývače</span></div>
    </div>

    <div id="here"></div>
    <div id="effects"></div>

    <!-- Questions and answers take turns in the one panel: filled by
         ui.js, like every other nav here. -->
    <nav id="pane"></nav>

    <div id="askpane">
      <nav id="cats"></nav>
      <div id="questions"></div>
    </div>

    <div id="logwrap"><div id="log"></div></div>
  </aside>
</div>

<!-- The hider's bar during the hiding period, over a full-width map. -->
<div id="hidebar" hidden>
  <div class="hb-text">
    <b id="hbtitle"></b>
    <span id="hbtext"></span>
  </div>
  <div class="hb-actions">
    <button id="hbrandom" class="ghost" data-i18n="hb.random">Vyber za mě</button>
    <button id="hbgo" disabled data-i18n="hb.go">Schovat se tady</button>
  </div>
</div>

<!-- Passing the phone. Covers everything: whatever is on screen when the
     device changes hands has been given away. -->
<div id="handoff" hidden>
  <div class="handcard">
    <div class="eyebrow" id="hoeyebrow"></div>
    <h2 id="hotitle"></h2>
    <p id="hotext"></p>
    <button id="hobtn"></button>
  </div>
</div>

<div id="modal" hidden><div class="sheet" id="sheet"></div></div>

<div id="start">
  <div class="startcard">
    <h1>Hide <span>+</span> Seek</h1>
    <p class="tag" data-i18n="start.tag"></p>

    <!-- First, because it decides what every field under it says. -->
    <label class="field">
      <span data-i18n="start.lang">Jazyk</span>
      <div class="choices row-choices" id="langchoices"></div>
    </label>

    <label class="field">
      <span data-i18n="start.map">Mapa</span>
      <div class="choices" id="mapchoices"></div>
    </label>

    <label class="field">
      <span data-i18n="start.players">Hráči</span>
      <div class="choices" id="modechoices"></div>
    </label>

    <label class="field" id="namefield" hidden>
      <span data-i18n="start.names">Kdo hraje</span>
      <div class="names">
        <input id="p1" type="text" maxlength="16" autocomplete="off" data-i18n-ph="start.p1">
        <input id="p2" type="text" maxlength="16" autocomplete="off" data-i18n-ph="start.p2">
      </div>
    </label>

    <label class="field" id="difffield">
      <span data-i18n="start.hider">Skrývač</span>
      <div class="choices" id="diffchoices"></div>
    </label>

    <label class="field">
      <span data-i18n="start.cards">Karty</span>
      <div class="choices" id="cardchoices"></div>
    </label>

    <label class="field">
      <span data-i18n-html="start.windowLabel">Doba skrývání <small>(náskok skrývače)</small></span>
      <div class="choices row-choices" id="hidechoices"></div>
    </label>

    <label class="field">
      <span data-i18n-html="start.seedLabel">Seed <small>(stejný seed, stejné kolo)</small></span>
      <input id="seed" type="text" inputmode="numeric">
    </label>

    <button id="play" disabled data-i18n="start.play">Spustit hru</button>

    <div id="offline">
      <div id="offstate" data-i18n="off.checking">Zjišťuji offline úložiště…</div>
      <div id="offbtns" hidden>
        <button id="offmap" disabled></button>
        <button id="offphotos" disabled></button>
        <button id="offclear" class="ghost" data-i18n="off.btnClear">Smazat</button>
      </div>
      <div id="offbar" hidden><i></i></div>
    </div>

    <p class="credit" id="credit"></p>
  </div>
</div>

<script src="vendor/leaflet.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
