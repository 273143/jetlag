<!doctype html>
<meta charset="utf-8"><title>RUNNING</title>
<style>body{background:#0d1014;color:#e8ecf1;font:13px/1.5 ui-monospace,monospace;margin:0}
iframe{border:1px solid #2a323d;display:block;margin:0 0 8px}</style>
<iframe id="f"></iframe>
<div id="out"></div>
<script type="module">
// The overlays that cover the whole screen, checked at phone sizes.
//
// This exists because of a real bug: #start is position:fixed and was centred
// with place-items:center and no overflow-y, so on a phone the card -- about
// 1100px with both maps described and the offline block at the foot -- simply
// ran off the bottom of a 900px screen and "Start the run" could not be
// reached or scrolled to. The game was uninstallable-in-practice on the device
// it was built for, and every existing test passed throughout, because they
// all drive a 1400x1200 window where the card fits.
//
// So the assertion is not "is overflow-y set" -- that is a spelling test. It
// is: put the button somewhere off-screen, and check a person could get to it.

const out = document.getElementById("out");
let bad = 0;
const log = (m) => out.insertAdjacentHTML("beforeend", m + "<br>");
const check = (c, m) => { if (!c) bad++; log((c ? "ok: " : "FAIL: ") + m); };
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const until = async (fn, ms = 12000) => {
  const t = Date.now();
  while (Date.now() - t < ms) { if (fn()) return true; await wait(60); }
  return false;
};

// A tall modern phone and a small cheap one, both in portrait. The second is
// the one that hurts: at 640 tall almost nothing fits.
const SIZES = [[412, 915, "412x915, a tall phone"], [360, 640, "360x640, a small phone"]];
const f = document.getElementById("f");

/** Is `el` inside the visible box, and did we have to scroll to get there? */
function reachable(el, h) {
  const r = el.getBoundingClientRect();
  return r.top >= 0 && r.bottom <= h && r.height > 0;
}

for (const [w, h, label] of SIZES) {
  log(`<br><b>${label}</b>`);
  f.style.width = w + "px";
  f.style.height = h + "px";
  // Fresh document per size: the layout is being measured, so it must be laid
  // out at that size from the start rather than reflowed into it.
  await new Promise((done) => {
    f.onload = done;
    f.src = `../index.html?map=brno&seed=7&t=${w}x${h}`;
  });
  const d = f.contentDocument;
  const $ = (id) => d.getElementById(id);
  await until(() => $("play") && !$("play").disabled);

  // ---- the start screen -------------------------------------------------
  const start = $("start"), play = $("play");
  const overflows = start.scrollHeight > start.clientHeight + 1;
  log(`   card ${start.scrollHeight}px into a ${start.clientHeight}px screen`);

  if (overflows) {
    check(start.scrollTop === 0, "starts at the top of the card, not mid-way");
    // The top must stay reachable. This is exactly what place-items:center
    // broke: it centres the overflow, putting the title above the top edge
    // with no way to scroll back up to it. Measure the card itself -- an
    // element further down stays non-negative and proves nothing.
    const cardTop = d.querySelector(".startcard").getBoundingClientRect().top;
    check(cardTop >= -1, `the top of the card is on screen (${Math.round(cardTop)}px in, not above it)`);
    start.scrollTop = start.scrollHeight;
    await wait(120);
    check(start.scrollTop > 0, "the start screen scrolls at all");
    check(reachable(play, h), "'Start the run' can be scrolled to");
    check(reachable($("offbtns"), h) || $("offbtns").hidden,
          "the offline buttons can be scrolled to");
  } else {
    check(reachable(play, h), "the card fits, and 'Start the run' is on screen");
  }

  // It must still be usable, not merely present.
  play.click();
  check(await until(() => !$("app").hidden || !$("modal").hidden),
        "pressing it actually does something");

  // ---- the handover, the other full-screen overlay -----------------------
  // Driven directly rather than through a match: it is a static card, and what
  // is being measured is whether a tall one traps its own button.
  const ho = $("handoff");
  ho.hidden = false;
  $("hotitle").textContent = "Bartholomew Featherstonehaugh hides";
  // Long enough to overflow even the tall phone, so the scrolling branch is
  // the one under test rather than a card that happens to fit.
  $("hotext").innerHTML = "The round starts at <b>Brno, Hlavní nádraží</b>, and "
    + "you have <b>30m</b> to get away from it. ".repeat(60);
  $("hobtn").textContent = "I'm Bartholomew Featherstonehaugh — show me the map";
  await wait(150);
  const btn = $("hobtn");
  if (ho.scrollHeight > ho.clientHeight + 1) {
    ho.scrollTop = ho.scrollHeight;
    await wait(120);
    check(reachable(btn, h), "a long handover card can still be scrolled to its button");
  } else {
    check(reachable(btn, h), "the handover card fits and its button is on screen");
  }
  ho.hidden = true;
}

document.title = bad ? "FAIL" : "PASS";
log(bad ? `<br>${bad} FAILURE(S)` : "<br>phone layout all good");
</script>
